<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оформление заказа — ресторан «Лотос»</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="app-page">
  <div id="app-header"></div>

  <main class="page">
    <section class="page-head">
      <div>
        <span class="eyebrow">Официант</span>
        <h1>Оформление заказа</h1>
        <p class="muted">Выберите стол и официанта, добавьте блюда в корзину и создайте заказ.</p>
      </div>
    </section>

    <section class="tab-panel is-active">
      <div class="order-layout">
        <div class="panel">
          <div class="panel-head">
            <h2>Меню</h2>
            <input id="catalog-search" class="input" type="search" placeholder="Поиск блюда..." autocomplete="off">
          </div>
          <div id="catalog" class="catalog"></div>
        </div>

        <aside class="panel cart-panel">
          <div class="panel-head">
            <h2>Заказ</h2>
            <button id="clear-cart" type="button" class="btn btn-ghost btn-small">Очистить</button>
          </div>

          <div class="form-grid">
            <label class="field">
              <span>Стол</span>
              <select id="order-table" required>
                <option value="">Загружаем столы...</option>
              </select>
            </label>
            <label class="field">
              <span>Официант</span>
              <select id="order-waiter" required>
                <option value="">Загружаем официантов...</option>
              </select>
            </label>
          </div>

          <div id="cart-items" class="cart-items"></div>

          <div class="cart-total">
            <span>Итого</span>
            <strong id="cart-total">0 ₽</strong>
          </div>

          <div id="order-error" class="form-error" hidden></div>

          <button id="submit-order" type="button" class="btn btn-primary btn-block">Создать заказ</button>
        </aside>
      </div>
    </section>
  </main>

  <script type="module" src="/js/order.js"></script>
</body>
</html>
